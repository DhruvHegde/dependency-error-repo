name: F3 Test Failures CI

on:
  push:
    branches: [ "main", "feature/f3-test-failures" ]
  workflow_dispatch:
    inputs:
      test_run_reason:
        description: 'Reason for running F3 test workflow'
        required: false
        default: 'Manual test run'

jobs:
  test-f3:
    name: "test-f3 (${{ matrix.error_type }} #${{ matrix.instance }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2]
        error_type:
          - AssertionError
          - IndexError
          - KeyError
          - TypeError
          - ValueError
          - AttributeError
          - ZeroDivisionError
          - FileNotFoundError

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir pytest

      - name: Inject Test Mutation
        run: |
          python automation/inject_mutation.py --error-type "${{ matrix.error_type }}"

      - name: Run Pytest Suite
        run: |
          pytest tests/test_app.py -v


