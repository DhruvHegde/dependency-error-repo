name: F3 Test Failures CI
run-name: "F3-${{ inputs.error_type || 'default' }}-${{ inputs.run_uuid || 'manual' }}"

on:
  push:
    branches: [ "main", "feature/f3-test-failures" ]
  workflow_dispatch:
    inputs:
      error_type:
        description: 'Specific Pytest failure type to inject'
        required: false
        default: 'none'
      run_uuid:
        description: 'Unique correlation ID for tracking'
        required: false
        default: 'manual'

jobs:
  test-f3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir pytest

      - name: Inject Failure Mutation
        if: ${{ inputs.error_type != '' && inputs.error_type != 'none' }}
        run: |
          python -c "
          error_type = '${{ inputs.error_type }}'
          mutations = {
              'AssertionError': '''
          def test_assertion_failure():
              \"\"\"Injected synthetic AssertionError.\"\"\"
              expected_status = 200
              actual_status = 500
              assert actual_status == expected_status, f\"Expected {expected_status}, received {actual_status}\"
          ''',
              'IndexError': '''
          def test_index_error():
              \"\"\"Injected synthetic IndexError.\"\"\"
              from src.app import get_list_item
              dataset = [10, 20, 30]
              get_list_item(dataset, 999)
          ''',
              'KeyError': '''
          def test_key_error():
              \"\"\"Injected synthetic KeyError.\"\"\"
              from src.app import get_dict_value
              config = {\"env\": \"staging\", \"retries\": 3}
              get_dict_value(config, \"missing_auth_token\")
          ''',
              'TypeError': '''
          def test_type_error():
              \"\"\"Injected synthetic TypeError.\"\"\"
              from src.app import calculate_division
              calculate_division(\"invalid_string\", 5)
          ''',
              'ValueError': '''
          def test_value_error():
              \"\"\"Injected synthetic ValueError.\"\"\"
              from src.app import convert_to_int
              convert_to_int(\"unparseable_alphanumeric_0x99\")
          ''',
              'AttributeError': '''
          def test_attribute_error():
              \"\"\"Injected synthetic AttributeError.\"\"\"
              from src.app import get_object_attribute
              get_object_attribute(object())
          ''',
              'ZeroDivisionError': '''
          def test_zero_division_error():
              \"\"\"Injected synthetic ZeroDivisionError.\"\"\"
              from src.app import calculate_division
              calculate_division(42, 0)
          ''',
              'FileNotFoundError': '''
          def test_file_not_found_error():
              \"\"\"Injected synthetic FileNotFoundError.\"\"\"
              from src.app import read_config_file
              read_config_file(\"fixtures/non_existent_pipeline_config.json\")
          '''
          }
          if error_type in mutations:
              with open('tests/test_app.py', 'a', encoding='utf-8') as f:
                  f.write('\n\n' + mutations[error_type])
              print(f'Successfully injected {error_type} mutation.')
          else:
              print(f'Error type {error_type} not recognized.')
          "

      - name: Run Pytest Suite
        run: |
          pytest tests/test_app.py -v

