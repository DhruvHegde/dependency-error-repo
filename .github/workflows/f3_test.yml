name: F3 Test Failures CI

on:
  push:
    branches: [ "main", "feature/f3-test-failures" ]
  workflow_dispatch:
    inputs:
      test_run_reason:
        description: 'Reason for running F3 test workflow'
        required: false
        default: 'Manual test run'

jobs:
  test-f3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Suite
        run: |
          pytest tests/test_app.py -v
